<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADAAT MINING</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="app">

    <header>
        <h2>SADAAT MINING</h2>
        <span>TON NETWORK</span>
    </header>

    <section class="balance">
        <h3>Sadaat Token</h3>
        <h1 id="balance">0.00 SADT</h1>
        <p>Your Mining Balance</p>
    </section>

    <section class="mining">
        <h2>⛏️ Mining</h2>
        <p id="mining-status">Mining is stopped</p>
        <button id="startMining">START MINING</button>
    </section>

    <section class="wallet">
        <h2>💎 TON Wallet</h2>
        <button id="connectWallet">Connect Wallet</button>
        <p id="walletAddress">Wallet not connected</p>
    </section>

    <section class="deposit">
        <h2>Deposit</h2>
        <h1>5 TON</h1>
        <p>Required deposit</p>
        <button id="depositButton">Deposit TON</button>
    </section>

    <section class="features">
        <button>👤 Profile</button>
        <button>👥 Referral</button>
        <button>💎 VIP Levels</button>
        <button>💰 Withdraw</button>
    </section>

    <nav>
        <button>Home</button>
        <button>Mining</button>
        <button>Friends</button>
        <button>Wallet</button>
    </nav>

</div>

<script src="script.js"></script>

</body>
</html>
